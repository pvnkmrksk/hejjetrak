[package]
name = "fictrac-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
fictrac-core.workspace = true
fictrac-io.workspace = true
fictrac-control.workspace = true
fictrac-camera = { path = "../../crates/fictrac-camera" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
glam.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
[lints]
workspace = true
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["metal", "wgsl"] }
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles", "wgsl"] }
