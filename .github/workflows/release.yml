name: Build release archives
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to rebuild
        type: choice
        default: all
        options: [all, ubuntu-22.04, windows-latest, macos-latest, macos-15-intel]
      source_ref:
        description: Existing source tag or commit (empty uses workflow ref)
        type: string
      release_tag:
        description: Existing release to attach archives to (empty only uploads workflow artifacts)
        type: string
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-22.04","windows-latest","macos-latest","macos-15-intel"]') }}
    # Keep the userspace ABI at 22.04 even when GitHub updates/retires runners.
    runs-on: ${{ matrix.os == 'ubuntu-22.04' && 'ubuntu-latest' || matrix.os }}
    container: ${{ matrix.os == 'ubuntu-22.04' && 'ubuntu:22.04' || '' }}
    steps:
      - name: Ubuntu 22.04 build tools and native desktop libraries
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git gh build-essential binutils pkg-config python3 python-is-python3 libudev-dev libxkbcommon-dev libwayland-dev libclang-dev dpkg-dev desktop-file-utils libxkbcommon-x11-0 libwayland-cursor0 libwayland-egl1 libx11-6 libx11-xcb1 libxcursor1 libxi6 libxrandr2 libegl1 libgles2 libvulkan1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Trust the checked-out workspace inside Linux containers
        if: runner.os == 'Linux'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify release tag matches the packaged source
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          python scripts/package.py --check-release-tag "$EXPECTED_RELEASE_TAG"
          tag_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_RELEASE_TAG}" --jq .sha)
          source_commit=$(git rev-parse HEAD)
          if [ "$tag_commit" != "$source_commit" ]; then
            echo '::error::The checked-out source is not the release tag commit. Rebuild the matching tag rather than attaching different source to a release.'
            exit 1
          fi
      - name: Record packaged source revision
        shell: bash
        run: |
          source_commit=$(git rev-parse HEAD)
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Cannot identify the exact packaged source revision.'
            exit 1
          fi
          echo "PACKAGE_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Portable Windows runtime linkage
        if: runner.os == 'Windows'
        shell: pwsh
        # Explicit flags also make immutable older-tag rebuilds portable.
        run: Add-Content $env:GITHUB_ENV 'RUSTFLAGS=-C target-feature=+crt-static'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Package and development-tool regressions
        run: |
          python -m unittest discover -s scripts -p test_package.py
          python -m unittest discover -s scripts -p test_overnight_soak.py
          python -m unittest discover -s scripts -p test_bridged_launcher.py
      - name: Patched Linux camera adapter regression
        if: runner.os == 'Linux' && hashFiles('vendor/nokhwa-bindings-linux/Cargo.toml') != ''
        run: cargo test -p nokhwa-bindings-linux --lib --locked
      - name: Patched Rust decoder regression suite
        run: cargo test --manifest-path vendor/oxideav-h264/Cargo.toml --lib --locked
      - run: cargo build --workspace --release --locked
      - run: cargo run -p fictrac --release --locked -- demo --output ci-demo --frames 120
      - name: Verify Windows redistributable independence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $tools = @(Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending)
          if ($tools.Count -eq 0) { throw 'Visual Studio dumpbin was not found; dependency verification cannot run.' }
          $dumpbinPath = $tools[0].FullName
          foreach ($binary in @('target/release/fictrac.exe', 'target/release/fictrac-desktop.exe')) {
            $dependencies = & $dumpbinPath /DEPENDENTS $binary
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $binary" }
            $dependencies | Write-Output
            if (($dependencies -join "`n") -match '(?i)\b(vcruntime|msvcp|msvcr|concrt)\d[^\s]*\.dll') {
              throw "$binary requires a separately installed Visual C++ runtime. Rebuild with static CRT linkage."
            }
          }
      - run: cargo vendor --locked third-party-source
      - run: python scripts/prepare_missing_notices.py --registry third-party-source --fetch-upstream
      - run: python scripts/package.py
      - name: Verify Linux installer metadata and extracted payload
        if: runner.os == 'Linux'
        run: |
          python3 scripts/test_package.py
          dpkg-deb --info dist/hejjetrac-linux-amd64.deb
          dpkg-deb --contents dist/hejjetrac-linux-amd64.deb
          dpkg-deb --extract dist/hejjetrac-linux-amd64.deb /tmp/hejjetrak-deb-check
          desktop-file-validate /tmp/hejjetrak-deb-check/usr/share/applications/hejjetrak.desktop
          /tmp/hejjetrak-deb-check/usr/bin/hejjetrac-cli schema > /tmp/hejjetrak-deb-schema.json
          test -s /tmp/hejjetrak-deb-schema.json
          test -f /tmp/hejjetrak-deb-check/usr/lib/hejjetrak/examples/sample.mp4
          apt-get --simulate install ./dist/hejjetrac-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: hejjetrac-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
      - name: Attach platform archive to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/*.zip dist/*.tar.gz dist/*.deb)
          gh release upload "$RELEASE_TAG" "${archives[@]}" --clobber
  linux-compatibility:
    name: Linux package runtime (Ubuntu ${{ matrix.ubuntu }})
    needs: package
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'ubuntu-22.04'
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - name: Native runtime, software graphics and installer tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ca-certificates git python3 dpkg desktop-file-utils xvfb xauth mesa-vulkan-drivers libgl1-mesa-dri
      - uses: actions/checkout@v4
        with:
          # Test tools follow this workflow revision, including when the build
          # source_ref is an older immutable application tag.
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: hejjetrac-Linux-X64
          path: packages
      - name: Install actual Debian package and verify the same portable build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y ./packages/hejjetrac-linux-amd64.deb
          python3 scripts/test_linux_package.py --archive packages/hejjetrac-linux-x86_64.tar.gz --output linux-package-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-runtime-ubuntu-${{ matrix.ubuntu }}
          path: linux-package-runtime/
          if-no-files-found: warn
