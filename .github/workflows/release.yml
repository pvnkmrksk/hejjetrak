name: Build release archives
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to rebuild
        type: choice
        default: all
        options: [all, ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
      source_ref:
        description: Existing source tag or commit (empty uses workflow ref)
        type: string
      release_tag:
        description: Existing release to attach archives to (empty only uploads workflow artifacts)
        type: string
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-latest","windows-latest","macos-latest","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Portable Windows runtime linkage
        if: runner.os == 'Windows'
        shell: pwsh
        # Explicit flags also make immutable older-tag rebuilds portable.
        run: Add-Content $env:GITHUB_ENV 'RUSTFLAGS=-C target-feature=+crt-static'
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libwayland-dev libclang-dev dpkg-dev desktop-file-utils libxkbcommon-x11-0 libwayland-cursor0 libwayland-egl1 libx11-6 libx11-xcb1 libxcursor1 libxi6 libxrandr2 libegl1 libgles2 libvulkan1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Patched Rust decoder regression suite
        run: cargo test --manifest-path vendor/oxideav-h264/Cargo.toml --lib --locked
      - run: cargo build --workspace --release --locked
      - run: cargo run -p fictrac --release --locked -- demo --output ci-demo --frames 120
      - name: Verify Windows redistributable independence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $tools = @(Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending)
          if ($tools.Count -eq 0) { throw 'Visual Studio dumpbin was not found; dependency verification cannot run.' }
          $dumpbinPath = $tools[0].FullName
          foreach ($binary in @('target/release/fictrac.exe', 'target/release/fictrac-desktop.exe')) {
            $dependencies = & $dumpbinPath /DEPENDENTS $binary
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $binary" }
            $dependencies | Write-Output
            if (($dependencies -join "`n") -match '(?i)\b(vcruntime|msvcp|msvcr|concrt)\d[^\s]*\.dll') {
              throw "$binary requires a separately installed Visual C++ runtime. Rebuild with static CRT linkage."
            }
          }
      - run: cargo vendor --locked third-party-source
      - run: python scripts/package.py
      - name: Verify Linux installer metadata and extracted payload
        if: runner.os == 'Linux'
        run: |
          python3 scripts/test_package.py
          dpkg-deb --info dist/hejjetrak-linux-amd64.deb
          dpkg-deb --contents dist/hejjetrak-linux-amd64.deb
          dpkg-deb --extract dist/hejjetrak-linux-amd64.deb /tmp/hejjetrak-deb-check
          desktop-file-validate /tmp/hejjetrak-deb-check/usr/share/applications/hejjetrak.desktop
          /tmp/hejjetrak-deb-check/usr/bin/hejjetrak-cli schema > /tmp/hejjetrak-deb-schema.json
          test -s /tmp/hejjetrak-deb-schema.json
          test -f /tmp/hejjetrak-deb-check/usr/lib/hejjetrak/examples/sample.mp4
          apt-get --simulate install ./dist/hejjetrak-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: hejjetrak-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
      - name: Attach platform archive to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/*.zip dist/*.tar.gz dist/*.deb)
          gh release upload "$RELEASE_TAG" "${archives[@]}" --clobber
