name: Rust portability and regression checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            runner: ubuntu-latest
            image: ubuntu:22.04
          - os: ubuntu-24.04
            runner: ubuntu-latest
            image: ubuntu:24.04
          - os: windows-latest
            runner: windows-latest
            image: ''
          - os: macos-latest
            runner: macos-latest
            image: ''
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Linux build tools and native desktop libraries
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y tzdata ca-certificates curl git build-essential pkg-config python3 python-is-python3 libudev-dev libxkbcommon-dev libwayland-dev libclang-dev
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace inside Linux containers
        if: runner.os == 'Linux'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Timezone data for Windows development-tool tests
        if: runner.os == 'Windows'
        run: python -m pip install tzdata==2025.2
      - name: Package and development-tool regressions
        shell: bash
        run: |
          python -m unittest discover -s scripts -p test_package.py
          python -m unittest discover -s scripts -p test_overnight_soak.py
          python -m unittest discover -s scripts -p test_bridged_launcher.py
          python -m unittest discover -s scripts -p test_prepare_missing_notices.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Patched Linux camera adapter regression
        if: runner.os == 'Linux' && hashFiles('vendor/nokhwa-bindings-linux/Cargo.toml') != ''
        run: cargo test -p nokhwa-bindings-linux --lib --locked
      - name: Patched Rust decoder regression suite
        run: cargo test --manifest-path vendor/oxideav-h264/Cargo.toml --lib --locked
      - run: cargo build --workspace --release --locked
      - run: cargo run -p fictrac --release --locked -- demo --output ci-demo --frames 120
      # Include dependency sources and license texts in downloadable artifacts.
      - run: cargo vendor --locked --versioned-dirs third-party-source
      - name: Collect exact dependency notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_missing_notices.py --registry third-party-source --fetch-upstream
      - uses: actions/upload-artifact@v4
        with:
          name: fictrac-${{ matrix.os }}-${{ runner.arch }}
          path: |
            target/release/fictrac
            target/release/fictrac.exe
            target/release/fictrac-desktop
            target/release/fictrac-desktop.exe
            examples/
            README.md
            LICENSE
            ATTRIBUTION.md
            THIRD_PARTY.md
            docs/
            third-party-source/
            vendor/oxideav-h264/
          if-no-files-found: error
