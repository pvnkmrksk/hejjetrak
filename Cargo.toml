[workspace]
members = ["crates/fictrac-core", "crates/fictrac-io", "crates/fictrac-camera", "crates/fictrac-control", "apps/fictrac", "apps/fictrac-desktop"]
default-members = ["apps/fictrac-desktop"]
exclude = ["vendor/oxideav-h264"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
license = "CC-BY-NC-SA-3.0"

[workspace.dependencies]
fictrac-core = { path = "crates/fictrac-core" }
fictrac-io = { path = "crates/fictrac-io" }
fictrac-control = { path = "crates/fictrac-control" }
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
oxideav-core = "=0.1.41"
oxideav-h264 = "=0.1.9"
oxideav-mp4 = "=0.0.10"

[patch.crates-io]
oxideav-h264 = { path = "vendor/oxideav-h264" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

